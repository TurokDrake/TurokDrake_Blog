<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST - TUROK'S LAPUTA</title>
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/post.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>
    
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <div class="logo"></div>
            <span class="brand-title">TUROK'S LAPUTA</span>
        </a>
        <nav class="site-nav">
            <a href="index.html">首页</a> / 
            <a href="about.html">关于我</a> / 
            <a href="archive.html">文章</a>
        </nav>
    </header>

    <main class="post-container">
        <article id="content" class="markdown-body">
            <p class="loading-text">LOADING ARTICLE...</p>
        </article>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 获取 URL 中传递的 file 参数 (如: post.html?file=posts/helloworld.md)
            const urlParams = new URLSearchParams(window.location.search);
            const postFilePath = urlParams.get('file');

            if (postFilePath) {
                // 2. 拉取 Markdown 文件内容
                fetch(postFilePath)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(text => {
                        // 3. 正则匹配，提取文章最顶部的 YAML 元数据 (Front Matter)
                        const frontMatterRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
                        const match = text.match(frontMatterRegex);
                        
                        let markdownContent = text;
                        let meta = {
                            title: '',
                            date: '',
                            category: '',
                            tags: []
                        };

                        if (match) {
                            const yamlText = match[1];
                            markdownContent = match[2]; // 剥离元数据后只保留正文内容
                            
                            // 提取 title（标题）
                            const titleMatch = yamlText.match(/title:\s*["']?([^"'\n]+)["']?/);
                            if (titleMatch) meta.title = titleMatch[1].trim();

                            // 提取 date（日期）
                            const dateMatch = yamlText.match(/date:\s*["']?([^"'\n]+)["']?/);
                            if (dateMatch) meta.date = dateMatch[1].trim();

                            // 提取 category（分类）
                            const categoryMatch = yamlText.match(/category:\s*["']?([^"'\n]+)["']?/);
                            if (categoryMatch) meta.category = categoryMatch[1].trim();

                            // 提取 tags（标签，格式如: tags: ["Design", "CSS"]）
                            const tagsMatch = yamlText.match(/tags:\s*\[(.*?)\]/);
                            if (tagsMatch && tagsMatch[1].trim() !== '') {
                                meta.tags = tagsMatch[1].split(',').map(t => t.replace(/["'\s]/g, '')).filter(t => t);
                            }
                        }

                        // 修改浏览器标签页标题
                        if (meta.title) {
                            document.title = `${meta.title} - TUROK'S LAPUTA`;
                        }

                        // 4. 构建瑞士极简风格（亮红分类 + 大写标题 + 黑框标签 + 分割线）的头部 UI
                        let metaHTML = '';
                        if (meta.title || meta.category || meta.date || meta.tags.length > 0) {
                            metaHTML = `
                                <header class="post-header-meta" style="margin-bottom: 2.5rem;">
                                    ${meta.category ? `<div style="color: #E63946; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 0.5rem;">CATEGORY // ${meta.category}</div>` : ''}
                                    ${meta.title ? `<h1 style="color: #1A1A1A; font-size: 2.2rem; font-weight: 900; line-height: 1.2; text-transform: uppercase; letter-spacing: -0.5px; margin-bottom: 1rem;">${meta.title}</h1>` : ''}
                                    
                                    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.85rem; font-weight: 700; color: #1A1A1A;">
                                        ${meta.date ? `<span style="text-transform: uppercase; opacity: 0.8;">DATE: ${meta.date}</span>` : '<span></span>'}
                                        ${meta.tags.length > 0 ? `
                                            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                                                ${meta.tags.map(tag => `<span style="border: 1px solid #1A1A1A; padding: 2px 8px; font-size: 0.75rem; text-transform: uppercase;">#${tag}</span>`).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                    <hr style="border: none; border-top: 1px solid #E63946; margin-top: 1.5rem; margin-bottom: 0;">
                                </header>
                            `;
                        }

                        // 5. 将 Markdown 解析为 HTML 页面
                        if (window.marked) {
                            if (window.markedFootnote) {
                                marked.use(markedFootnote());
                            }
                            const renderedBody = marked.parse(markdownContent);
                            document.getElementById('content').innerHTML = metaHTML + renderedBody;
                        } else {
                            document.getElementById('content').innerHTML = metaHTML + markdownContent;
                        }

                        // 6. 重新渲染 MathJax 数学公式
                        if (window.MathJax && MathJax.typesetPromise) {
                            MathJax.typesetPromise();
                        }

                        // 7. 增强代码块：动态添加大写语言标签与 COPY 按钮
                        const pres = document.querySelectorAll('#content pre');
                        pres.forEach(pre => {
                            const codeElement = pre.querySelector('code');
                            const wrapper = document.createElement('div');
                            wrapper.className = 'code-block-wrapper';
                            pre.parentNode.insertBefore(wrapper, pre);
                            wrapper.appendChild(pre);

                            const header = document.createElement('div');
                            header.className = 'code-header';

                            let langName = 'CODE';
                            if (codeElement) {
                                const classList = Array.from(codeElement.classList);
                                const langClass = classList.find(c => c.startsWith('language-'));
                                if (langClass) {
                                    langName = langClass.replace('language-', '').toUpperCase();
                                }
                            }

                            const langSpan = document.createElement('span');
                            langSpan.className = 'code-lang';
                            langSpan.textContent = langName;

                            const copyBtn = document.createElement('button');
                            copyBtn.className = 'copy-btn';
                            copyBtn.textContent = 'COPY';

                            copyBtn.addEventListener('click', () => {
                                const codeText = codeElement ? codeElement.innerText : pre.innerText;
                                navigator.clipboard.writeText(codeText).then(() => {
                                    copyBtn.textContent = 'COPIED!';
                                    copyBtn.classList.add('copied');
                                    
                                    setTimeout(() => {
                                        copyBtn.textContent = 'COPY';
                                        copyBtn.classList.remove('copied');
                                    }, 2000);
                                });
                            });

                            header.appendChild(langSpan);
                            header.appendChild(copyBtn);
                            wrapper.insertBefore(header, pre);
                        });
                    })
                    .catch(error => {
                        document.getElementById('content').innerHTML = `
                            <p class="error-text">ERROR LOADING POST: ${error.message}</p>
                        `;
                    });
            } else {
                document.getElementById('content').innerHTML = `
                    <p class="error-text">NO POST SPECIFIED.</p>
                `;
            }
        });
    </script>
</body>
</html>
