<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST - TUROK'S LAPUTA</title>
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/post.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <div class="logo"></div>
            <span class="brand-title">TUROK'S LAPUTA</span>
        </a>
        <nav class="site-nav">
            <a href="index.html">首页</a> /
            <a href="about.html">关于我</a> /
            <a href="archive.html">文章</a>
        </nav>
    </header>

    <main class="post-container">
        <article id="content" class="markdown-body">
            <p class="loading-text">LOADING ARTICLE...</p>
        </article>
    </main>

    <script>
        // 确保页面加载了 marked-footnote 后，进行注册
        if (typeof markedFootnote !== 'undefined') {
            marked.use(markedFootnote());
        }
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 获取 URL 中传递的 file 参数 (如: post.html?file=posts/helloworld.md)
            const urlParams = new URLSearchParams(window.location.search);
            let postFilePath = urlParams.get('file');

            if (postFilePath) {
                // 清洗路径：将反斜杠替换为正斜杠，并去除多余空格
                postFilePath = postFilePath.replace(/\\/g, '/').trim();

                console.log("正在加载文章路径：", postFilePath);

                // 2. 直接使用相对路径发起请求（不加前面的斜杠，完美兼容本地和线上自定义域名）
                fetch(postFilePath)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(markdownText => {
                        const contentElement = document.getElementById('content');

                        // 简单的 YAML Front Matter 过滤
                        let bodyText = markdownText;
                        if (markdownText.startsWith('---')) {
                            const parts = markdownText.split('---');
                            if (parts.length >= 3) {
                                bodyText = parts.slice(2).join('---');
                            }
                        }

                        contentElement.innerHTML = marked.parse(bodyText);

                        // 代码块 COPY 按钮与高亮逻辑
                        const preElements = contentElement.querySelectorAll('pre');
                        preElements.forEach(pre => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'code-block-wrapper';
                            pre.parentNode.insertBefore(wrapper, pre);
                            wrapper.appendChild(pre);

                            const header = document.createElement('div');
                            header.className = 'code-header';

                            const langSpan = document.createElement('span');
                            langSpan.className = 'code-lang';
                            langSpan.textContent = 'CODE';

                            const copyBtn = document.createElement('button');
                            copyBtn.className = 'copy-btn';
                            copyBtn.textContent = 'COPY';

                            copyBtn.addEventListener('click', () => {
                                const codeElement = pre.querySelector('code');
                                const codeText = codeElement ? codeElement.innerText : pre.innerText;
                                navigator.clipboard.writeText(codeText).then(() => {
                                    copyBtn.textContent = 'COPIED!';
                                    copyBtn.classList.add('copied');
                                    setTimeout(() => {
                                        copyBtn.textContent = 'COPY';
                                        copyBtn.classList.remove('copied');
                                    }, 2000);
                                });
                            });

                            header.appendChild(langSpan);
                            header.appendChild(copyBtn);
                            wrapper.insertBefore(header, pre);
                        });

                        // 数学公式渲染
                        if (window.MathJax && window.MathJax.typesetPromise) {
                            window.MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
                        }
                    })
                    .catch(error => {
                        document.getElementById('content').innerHTML = `
                    <p class="error-text">ERROR LOADING POST: ${error.message}</p>
                    <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">尝试请求的相对路径: <code>${postFilePath}</code></p>
                    <p style="font-size: 0.85rem; color: #E63946; margin-top: 4px;">提示：请检查 GitHub 仓库的 <code>posts/</code> 文件夹中是否存在该文件，且文件名大小写完全一致。</p>
                `;
                    });
            } else {
                document.getElementById('content').innerHTML = `
            <p class="error-text">NO POST SPECIFIED.</p>
        `;
            }
        });
    </script>

</body>

</html>
