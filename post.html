<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST - TUROK'S LAPUTA</title>
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/post.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/powershell.min.js"></script>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <div class="logo"></div>
            <span class="brand-title">TUROK'S LAPUTA</span>
        </a>
        <nav class="site-nav">
            <a href="index.html">首页</a> /
            <a href="about.html">关于我</a> /
            <a href="archive.html">文章</a>
        </nav>
    </header>

    <main class="post-container">
        <article id="content" class="markdown-body">
            <p class="loading-text">LOADING ARTICLE...</p>
        </article>
    </main>

    <script>
        // 编程语言别名规范化与顶部美化名称映射表
        const LANGUAGE_MAP = {
            // C 语言家族
            'c': { hljs: 'c', display: 'C' },
            'h': { hljs: 'c', display: 'C' },
            'cpp': { hljs: 'cpp', display: 'C++' },
            'c++': { hljs: 'cpp', display: 'C++' },
            'hpp': { hljs: 'cpp', display: 'C++' },
            'csharp': { hljs: 'csharp', display: 'C#' },
            'c#': { hljs: 'csharp', display: 'C#' },
            'cs': { hljs: 'csharp', display: 'C#' },

            // 命令行与 Shell
            'powershell': { hljs: 'powershell', display: 'POWERSHELL' },
            'ps': { hljs: 'powershell', display: 'POWERSHELL' },
            'ps1': { hljs: 'powershell', display: 'POWERSHELL' },
            'gitbash': { hljs: 'bash', display: 'GIT BASH' },
            'git-bash': { hljs: 'bash', display: 'GIT BASH' },
            'bash': { hljs: 'bash', display: 'GIT BASH' },
            'sh': { hljs: 'bash', display: 'SH' },
            'zsh': { hljs: 'bash', display: 'ZSH' },

            // 脚本与热门语言（包含 Python, Go, Lua 等）
            'python': { hljs: 'python', display: 'PYTHON' },
            'py': { hljs: 'python', display: 'PYTHON' },
            'go': { hljs: 'go', display: 'GO' },
            'golang': { hljs: 'go', display: 'GO' },
            'lua': { hljs: 'lua', display: 'LUA' },
            'js': { hljs: 'javascript', display: 'JAVASCRIPT' },
            'javascript': { hljs: 'javascript', display: 'JAVASCRIPT' },
            'ts': { hljs: 'typescript', display: 'TYPESCRIPT' },
            'typescript': { hljs: 'typescript', display: 'TYPESCRIPT' },
            'html': { hljs: 'xml', display: 'HTML' },
            'xml': { hljs: 'xml', display: 'XML' },
            'css': { hljs: 'css', display: 'CSS' },
            'json': { hljs: 'json', display: 'JSON' },
            'sql': { hljs: 'sql', display: 'SQL' },
            'yaml': { hljs: 'yaml', display: 'YAML' },
            'yml': { hljs: 'yaml', display: 'YAML' }
        };
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化全屏图片放大功能
            initImageLightbox();

            // 配置 Marked 支持脚注
            if (typeof markedFootnote !== 'undefined') {
                marked.use(markedFootnote());
            }

            // 从 URL 获取请求的文章路径
            const urlParams = new URLSearchParams(window.location.search);
            const postFilePath = urlParams.get('file');

            if (postFilePath) {
                fetch(postFilePath)
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        return response.text();
                    })
                    .then(markdown => {
                        // 1. 解析 YAML Front Matter 属性
                        const { attributes, body } = parseFrontMatter(markdown);

                        // 更新浏览器标签页标题
                        if (attributes.title) {
                            document.title = `${attributes.title} - TUROK'S LAPUTA`;
                        }

                        // 2. 渲染文章属性头部 (Title, Date, Category, Tags)
                        let headerHtml = '';
                        if (attributes.title || attributes.category || attributes.date || attributes.tags) {
                            headerHtml = `
                                <header class="post-header">
                                    ${attributes.category ? `<div class="post-category">${attributes.category}</div>` : ''}
                                    ${attributes.title ? `<h1 class="post-title">${attributes.title}</h1>` : ''}
                                    <div class="post-meta">
                                        ${attributes.date ? `<span class="post-date">DATE: ${attributes.date}</span>` : ''}
                                        ${Array.isArray(attributes.tags) && attributes.tags.length ? `
                                            <div class="post-tags">
                                                ${attributes.tags.map(tag => `<span class="tag-badge">#${tag}</span>`).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                </header>
                            `;
                        }

                        // 3. 将解析后的正文内容与属性头一起插入页面
                        document.getElementById('content').innerHTML = headerHtml + `<article class="markdown-body">${marked.parse(body)}</article>`;

                        // 4. 代码块高亮与黑客风顶栏渲染
                        document.querySelectorAll('.markdown-body pre code').forEach((codeBlock) => {
                            // 提取 Markdown 编写的原始语言标识
                            let rawLang = '';
                            codeBlock.classList.forEach(cls => {
                                if (cls.startsWith('language-')) {
                                    rawLang = cls.replace('language-', '').toLowerCase();
                                }
                            });

                            // 检索语言映射表，自动适配 Highlight.js 识别规则与顶部美化名称
                            let hljsLang = rawLang;
                            let displayLang = rawLang ? rawLang.toUpperCase() : 'CODE';

                            if (rawLang && LANGUAGE_MAP[rawLang]) {
                                hljsLang = LANGUAGE_MAP[rawLang].hljs;
                                displayLang = LANGUAGE_MAP[rawLang].display;
                            }

                            // 动态赋予 Highlight.js 可精准识别的 class
                            if (hljsLang) {
                                codeBlock.className = `language-${hljsLang}`;
                            }

                            // 执行语法高亮
                            if (typeof hljs !== 'undefined') {
                                hljs.highlightElement(codeBlock);
                            }

                            // 构造黑客风格包裹容器与顶栏
                            const pre = codeBlock.parentElement;
                            if (pre.parentNode.classList.contains('code-block-wrapper')) return;

                            const wrapper = document.createElement('div');
                            wrapper.className = 'code-block-wrapper';

                            const header = document.createElement('div');
                            header.className = 'code-header';

                            const langSpan = document.createElement('span');
                            langSpan.className = 'code-lang';
                            langSpan.textContent = displayLang;

                            const copyBtn = document.createElement('button');
                            copyBtn.className = 'copy-btn';
                            copyBtn.textContent = 'COPY';

                            copyBtn.addEventListener('click', () => {
                                navigator.clipboard.writeText(codeBlock.textContent).then(() => {
                                    copyBtn.textContent = 'COPIED!';
                                    copyBtn.classList.add('copied');
                                    setTimeout(() => {
                                        copyBtn.textContent = 'COPY';
                                        copyBtn.classList.remove('copied');
                                    }, 2000);
                                });
                            });

                            header.appendChild(langSpan);
                            header.appendChild(copyBtn);

                            pre.parentNode.insertBefore(wrapper, pre);
                            wrapper.appendChild(header);
                            wrapper.appendChild(pre);
                        });

                        // 5. 数学公式渲染
                        if (window.MathJax && window.MathJax.typesetPromise) {
                            window.MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
                        }
                    })
                    .catch(error => {
                        document.getElementById('content').innerHTML = `
                            <p class="error-text">ERROR LOADING POST: ${error.message}</p>
                            <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">尝试请求的相对路径: <code>${postFilePath}</code></p>
                        `;
                    });
            } else {
                document.getElementById('content').innerHTML = `<p class="error-text">NO POST SPECIFIED.</p>`;
            }
        });

        // YAML Front Matter 解析算法
        function parseFrontMatter(text) {
            const frontMatterRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/;
            const match = text.match(frontMatterRegex);
            if (!match) {
                return { attributes: {}, body: text };
            }

            const yamlStr = match[1];
            const body = text.replace(frontMatterRegex, '');
            const attributes = {};

            yamlStr.split(/\r?\n/).forEach(line => {
                const colonIdx = line.indexOf(':');
                if (colonIdx !== -1) {
                    const key = line.slice(0, colonIdx).trim();
                    let val = line.slice(colonIdx + 1).trim();

                    // 清除首尾引号
                    if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                        val = val.slice(1, -1);
                    }
                    // 解析数组格式 ["版本控制", "提交信息", "Commit"]
                    if (val.startsWith('[') && val.endsWith(']')) {
                        try {
                            val = JSON.parse(val.replace(/'/g, '"'));
                        } catch (e) {
                            val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
                        }
                    }
                    if (key) {
                        attributes[key] = val;
                    }
                }
            });

            return { attributes, body };
        }

        // 全局图片放大灯箱功能
        function initImageLightbox() {
            let overlay = document.querySelector('.lightbox-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'lightbox-overlay';
                overlay.innerHTML = '<img src="" alt="Enlarged view">';
                document.body.appendChild(overlay);
            }

            const lightboxImg = overlay.querySelector('img');

            document.addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG' && e.target.closest('.markdown-body')) {
                    lightboxImg.src = e.target.src;
                    overlay.classList.add('active');
                }
            });

            overlay.addEventListener('click', () => overlay.classList.remove('active'));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') overlay.classList.remove('active');
            });
        }
    </script>

</body>

</html>
