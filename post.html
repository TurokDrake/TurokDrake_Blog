<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST - TUROK'S LAPUTA</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/post.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>
    
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <div class="logo"></div>
            <span class="brand-title">TUROK'S LAPUTA</span>
        </a>
        <nav class="site-nav">
            <a href="index.html">首页</a> / 
            <a href="about.html">关于我</a> / 
            <a href="#">文章</a> / 
            <!-- <a href="#">CONTACT</a> -->
        </nav>
    </header>

    <div class="post-navigation">
        <a href="index.html" class="back-btn">&larr; 返回首页</a>
    </div>

    <main class="post-wrapper">
        <hr class="red-divider">

        <article id="content" class="markdown-body">
            <p class="loading-text">加载文章ing...</p>
        </article>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 TUROK'S LAPUTA.</p>
    </footer>

    <script>
        window.addEventListener('load', () => {
            // 配置 Marked 插件
            if (typeof markedFootnote !== 'undefined') {
                marked.use(markedFootnote());
            }

            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');

            if (fileName) {
                fetch(fileName)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(markdownText => {
                        // 1. 渲染 Markdown
                        const contentDiv = document.getElementById('content');
                        contentDiv.innerHTML = marked.parse(markdownText);

                        // 2. 动态更新网页标题（取第一个 H1 文本）
                        const firstH1 = contentDiv.querySelector('h1');
                        if (firstH1) {
                            document.title = `${firstH1.innerText} - TUROK'S LAPUTA`;
                        }

                        // 3. 渲染 MathJax 数学公式
                        if (window.MathJax && MathJax.typesetPromise) {
                            MathJax.typesetPromise();
                        }

                        // 4. 为代码块生成瑞士极简风格工具栏与复制按钮
                        const codeBlocks = contentDiv.querySelectorAll('pre');
                        codeBlocks.forEach(pre => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'code-block-wrapper';
                            pre.parentNode.insertBefore(wrapper, pre);
                            wrapper.appendChild(pre);

                            const codeElement = pre.querySelector('code');
                            let language = 'TEXT';
                            if (codeElement) {
                                const langClass = Array.from(codeElement.classList).find(c => c.startsWith('language-'));
                                if (langClass) {
                                    language = langClass.replace('language-', '').toUpperCase();
                                }
                            }

                            const header = document.createElement('div');
                            header.className = 'code-header';

                            const langSpan = document.createElement('span');
                            langSpan.className = 'code-lang';
                            langSpan.textContent = language;

                            const copyBtn = document.createElement('button');
                            copyBtn.className = 'copy-btn';
                            copyBtn.textContent = 'COPY';
                            
                            copyBtn.addEventListener('click', () => {
                                const codeText = codeElement ? codeElement.innerText : pre.innerText;
                                navigator.clipboard.writeText(codeText).then(() => {
                                    copyBtn.textContent = 'COPIED!';
                                    copyBtn.classList.add('copied');
                                    
                                    setTimeout(() => {
                                        copyBtn.textContent = 'COPY';
                                        copyBtn.classList.remove('copied');
                                    }, 2000);
                                });
                            });

                            header.appendChild(langSpan);
                            header.appendChild(copyBtn);
                            wrapper.insertBefore(header, pre);
                        });
                    })
                    .catch(error => {
                        document.getElementById('content').innerHTML = `
                            <p class="error-text">ERROR LOADING POST: ${error.message}</p>
                        `;
                    });
            } else {
                document.getElementById('content').innerHTML = `
                    <p class="error-text">NO POST SPECIFIED.</p>
                `;
            }
        });
    </script>
</body>
</html>
