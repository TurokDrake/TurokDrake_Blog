<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST - TUROK'S LAPUTA</title>
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/post.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <div class="logo"></div>
            <span class="brand-title">TUROK'S LAPUTA</span>
        </a>
        <nav class="site-nav">
            <a href="index.html">首页</a> /
            <a href="about.html">关于我</a> /
            <a href="archive.html">文章</a>
        </nav>
    </header>

    <main class="post-container">
        <article id="content" class="markdown-body">
            <p class="loading-text">LOADING ARTICLE...</p>
        </article>
    </main>

    <script>
        
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 初始化全屏图片放大灯箱（采用事件委托，完美适应异步加载）
            initImageLightbox();

            // 2. 配置 Marked.js 支持脚注扩展
            if (typeof markedFootnote !== 'undefined') {
                marked.use(markedFootnote());
            }

            // 3. 从 URL 解析参数并拉取文章
            const urlParams = new URLSearchParams(window.location.search);
            const postFilePath = urlParams.get('file');

            if (postFilePath) {
                fetch(postFilePath)
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        return response.text();
                    })
                    .then(markdown => {
                        // 渲染 Markdown 内容
                        document.getElementById('content').innerHTML = marked.parse(markdown);

                        // 处理代码块：语法高亮 + 显示语言名称 + 复制按钮
                        document.querySelectorAll('.markdown-body pre code').forEach((codeBlock) => {
                            // 安全防错检查：确认 hljs 库加载完成后再执行高亮
                            if (typeof hljs !== 'undefined') {
                                hljs.highlightElement(codeBlock);
                            }

                            // 提取语言类型（例如 language-javascript -> JAVASCRIPT）
                            let lang = 'CODE';
                            codeBlock.classList.forEach(cls => {
                                if (cls.startsWith('language-')) {
                                    lang = cls.replace('language-', '').toUpperCase();
                                }
                            });

                            const pre = codeBlock.parentElement;
                            if (pre.parentNode.classList.contains('code-block-wrapper')) return;

                            const wrapper = document.createElement('div');
                            wrapper.className = 'code-block-wrapper';

                            const header = document.createElement('div');
                            header.className = 'code-header';

                            const langSpan = document.createElement('span');
                            langSpan.className = 'code-lang';
                            langSpan.textContent = lang;

                            const copyBtn = document.createElement('button');
                            copyBtn.className = 'copy-btn';
                            copyBtn.textContent = 'COPY';

                            copyBtn.addEventListener('click', () => {
                                navigator.clipboard.writeText(codeBlock.textContent).then(() => {
                                    copyBtn.textContent = 'COPIED!';
                                    copyBtn.classList.add('copied');
                                    setTimeout(() => {
                                        copyBtn.textContent = 'COPY';
                                        copyBtn.classList.remove('copied');
                                    }, 2000);
                                });
                            });

                            header.appendChild(langSpan);
                            header.appendChild(copyBtn);

                            pre.parentNode.insertBefore(wrapper, pre);
                            wrapper.appendChild(header);
                            wrapper.appendChild(pre);
                        });

                        // 数学公式渲染
                        if (window.MathJax && window.MathJax.typesetPromise) {
                            window.MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
                        }
                    })
                    .catch(error => {
                        document.getElementById('content').innerHTML = `
                            <p class="error-text">ERROR LOADING POST: ${error.message}</p>
                            <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">尝试请求的相对路径: <code>${postFilePath}</code></p>
                            <p style="font-size: 0.85rem; color: #E63946; margin-top: 4px;">提示：请检查 GitHub 仓库的 <code>posts/</code> 文件夹中是否存在该文件，且文件名大小写完全一致。</p>
                        `;
                    });
            } else {
                document.getElementById('content').innerHTML = `
                    <p class="error-text">NO POST SPECIFIED.</p>
                `;
            }
        });

        // 图片灯箱放大机制 (事件委托，无需关注图片异步加载时机)
        function initImageLightbox() {
            let overlay = document.querySelector('.lightbox-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'lightbox-overlay';
                overlay.innerHTML = '<img src="" alt="Enlarged view">';
                document.body.appendChild(overlay);
            }

            const lightboxImg = overlay.querySelector('img');

            // 监听文档所有点击，判断是否点到了正文里的图片
            document.addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG' && e.target.closest('.markdown-body')) {
                    lightboxImg.src = e.target.src;
                    overlay.classList.add('active');
                }
            });

            // 点击遮罩层或按 Esc 键关闭
            overlay.addEventListener('click', () => overlay.classList.remove('active'));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') overlay.classList.remove('active');
            });
        }
    </script>

</body>

</html>
