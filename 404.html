<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到 | Turok's Laputa</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 404 专属极简排版 */
    .not-found-container {
      max-width: 800px;
      margin: 120px auto 60px;
      padding: 0 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      color: #E63946; /* 高饱和亮红 */
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 20px;
    }
    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1A1A1A;
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    .error-desc {
      font-size: 1rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .actions {
      display: flex;
      gap: 20px;
      border-top: 1px solid #E63946;
      padding-top: 30px;
    }
    .btn-link {
      color: #1A1A1A;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: color 0.2s ease;
    }
    .btn-link:hover {
      color: #E63946;
    }
  </style>
</head>
<body style="background-color: #F7F5F0; color: #1A1A1A; margin: 0;">

  <div class="not-found-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found / 页面未找到</h1>
    <p class="error-desc">
      你所访问的页面不存在或已被移除。如果你是通过搜索引擎访问的旧博客链接，该文章可能已被更新或重构。
    </p>
    
  </div>

</body>
</html>
