<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATEGORIES - TUROK'S LAPUTA</title>

    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/archive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <div class="logo"></div>
            <span class="brand-title">TUROK'S LAPUTA</span>
        </a>
        <nav class="site-nav">
            <a href="index.html">首页</a> /
            <a href="about.html">关于我</a> /
            <a href="archive.html" class="active">文章</a> /
        </nav>
    </header>

    <main class="archive-container">
        <section class="archive-hero">
            <h1 class="archive-title">分类</h1>
            <div style="margin-top: 1.5rem; margin-bottom: 2rem;">
                <input type="text" id="search-input" placeholder="搜索文章标题或摘要..." style="width: 100%; max-width: 400px; padding: 10px 16px; border: 1px solid rgba(26,26,26,0.3); background: transparent; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #1A1A1A; outline: none;">
            </div>

            <div id="topic-bubbles" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem;"></div>

            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 2rem; font-family: 'Inter', sans-serif;">
                <span id="current-topic-label" style="font-weight: 900; font-size: 1.1rem; color: #E63946;">ALL TOPICS</span>
                <button id="reset-filter" style="display: none; background: none; border: 1px solid #E63946; color: #E63946; padding: 4px 12px; cursor: pointer; font-weight: 700; font-size: 0.8rem;">重置筛选</button>
            </div>
        </section>

        <section id="articles-list" class="archive-list">
            </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let allArticles = [];
            let activeCategory = null;

            const searchInput = document.getElementById('search-input');
            const articlesList = document.getElementById('articles-list');
            const topicBubblesContainer = document.getElementById('topic-bubbles');
            const currentTopicLabel = document.getElementById('current-topic-label');
            const resetBtn = document.getElementById('reset-filter');

            // 1. 自定义分类 SVG 图标映射表（支持你随时新增或自定义图标）
            const categoryIconMap = {
                "LIFE": `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`,
                "TEST": `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>`,
                // 默认兜底 SVG 图标
                "DEFAULT": `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>`
            };

            // 2. 异步加载 search.json
            fetch('data/search.json')
                .then(response => {
                    if (!response.ok) throw new Error('网络响应异常');
                    return response.json();
                })
                .then(data => {
                    allArticles = data;
                    updateUI(); // 数据加载成功后初始化界面
                })
                .catch(error => {
                    console.error('加载 search.json 失败：', error);
                    articlesList.innerHTML = `<p style="color: #E63946; font-family: 'Inter', sans-serif; font-weight: 700;">加载索引失败，请确保通过本地服务器（如 Live Server）预览网页。</p>`;
                });

            // 3. 动态渲染主题分类气泡（带 SVG 图标）
            function renderTopicBubbles() {
                if (!topicBubblesContainer) return;

                const categories = [...new Set(allArticles.map(item => item.category))];
                
                let html = '';
                categories.forEach(cat => {
                    const isSelected = activeCategory === cat;
                    const svgIcon = categoryIconMap[cat] || categoryIconMap["DEFAULT"];
                    
                    html += `
                        <div class="topic-bubble" data-category="${cat}" style="cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid ${isSelected ? '#E63946' : 'rgba(26,26,26,0.2)'}; border-radius: 50px; background: ${isSelected ? '#E63946' : 'transparent'}; color: ${isSelected ? '#F7F5F0' : '#1A1A1A'}; transition: all 0.2s ease;">
                            ${svgIcon}
                            <span style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase; font-family: 'Inter', sans-serif;">${cat}</span>
                        </div>
                    `;
                });
                
                topicBubblesContainer.innerHTML = html;

                // 绑定气泡点击事件
                document.querySelectorAll('.topic-bubble').forEach(bubble => {
                    bubble.addEventListener('click', () => {
                        const selectedCat = bubble.getAttribute('data-category');
                        activeCategory = (activeCategory === selectedCat) ? null : selectedCat;
                        updateUI();
                    });
                });
            }

            // 4. 渲染文章列表
            function renderArticles() {
                if (!articlesList) return;

                const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

                const filtered = allArticles.filter(item => {
                    const matchCategory = activeCategory ? item.category === activeCategory : true;
                    const matchKeyword = keyword === '' || 
                        item.title.toLowerCase().includes(keyword) || 
                        (item.excerpt && item.excerpt.toLowerCase().includes(keyword));
                    return matchCategory && matchKeyword;
                });

                if (filtered.length === 0) {
                    articlesList.innerHTML = `<p style="color: #1A1A1A; font-family: 'Inter', sans-serif; opacity: 0.6; padding: 2rem 0;">没有找到相关的文章。</p>`;
                    return;
                }

                let listHtml = '';
                filtered.forEach(article => {
                    listHtml += `
                        <article class="archive-item" style="display: flex; gap: 20px; margin-bottom: 2.5rem; border-bottom: 1px solid rgba(230, 57, 70, 0.3); padding-bottom: 1.5rem; align-items: baseline;">
                            <span style="color: #E63946; font-weight: 900; font-family: 'Inter', sans-serif; font-size: 0.9rem; min-width: 90px;">[ ${article.category || 'ARTICLE'} ]</span>
                            <div style="flex: 1;">
                                <h2 style="margin: 0 0 8px 0; font-size: 1.25rem;">
                                    <a href="${article.url}" style="color: #1A1A1A; text-decoration: none; font-weight: 900; font-family: 'Inter', sans-serif; transition: color 0.2s;" onmouseover="this.style.color='#E63946'" onmouseout="this.style.color='#1A1A1A'">${article.title}</a>
                                </h2>
                                <p style="margin: 0; color: #1A1A1A; opacity: 0.75; font-size: 0.95rem; font-family: 'Inter', sans-serif;">${article.excerpt || '暂无摘要描述...'}</p>
                            </div>
                        </article>
                    `;
                });

                articlesList.innerHTML = listHtml;
            }

            // 5. 更新总界面
            function updateUI() {
                renderTopicBubbles();
                renderArticles();

                if (currentTopicLabel) {
                    currentTopicLabel.textContent = activeCategory ? activeCategory : 'ALL TOPICS';
                }
                if (resetBtn) {
                    resetBtn.style.display = activeCategory ? 'inline-block' : 'none';
                }
            }

            // 6. 搜索框监听
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    renderArticles();
                });
            }

            // 7. 重置按钮监听
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    activeCategory = null;
                    if (searchInput) searchInput.value = '';
                    updateUI();
                });
            }
        });
    </script>
</body>
</html>
