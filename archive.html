<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATEGORIES - TUROK'S LAPUTA</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/archive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <div class="logo"></div>
            <span class="brand-title">TUROK'S LAPUTA</span>
        </a>
        <nav class="site-nav">
            <a href="index.html">HOME</a> / 
            <a href="about.html">ABOUT</a> / 
            <a href="archive.html" class="active">ARCHIVE</a> / 
            <a href="#">CONTACT</a>
        </nav>
    </header>

    <main class="archive-container">
        <section class="archive-hero">
            <h1 class="archive-title">TOPICS & DIRECTORY</h1>
            <p class="archive-subtitle">EXPLORE ARTICLES BY CATEGORY AND TOPIC</p>
        </section>

        <hr class="red-divider">

        <section class="topics-bubbles-grid" id="topics-grid">
            </section>

        <div class="topic-filter-bar">
            <span class="filter-status">SHOWING: <strong id="current-topic-label">ALL TOPICS</strong></span>
            <button class="reset-filter-btn" id="reset-filter-btn">SHOW ALL</button>
        </div>

        <section class="archive-articles-list" id="articles-list">
            </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 TUROK'S LAPUTA. INDEPENDENT MAGAZINE.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==========================================
            // 1. 定义主题目录配置 (可随时在此添加新主题和自定义 SVG)
            // ==========================================
            const topics = [
                {
                    id: 'DESIGN',
                    name: 'DESIGN',
                    count: 3,
                    // 自定义 SVG 图标 (设计/网格风格)
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l-5.5 9h11zM3.5 13.5h7v7h-7zM13.5 13.5h7v7h-7z"/></svg>`
                },
                {
                    id: 'TECH',
                    name: 'TECHNOLOGY',
                    count: 4,
                    // 自定义 SVG 图标 (芯片/代码风格)
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H6V8h12v8z"/></svg>`
                },
                {
                    id: 'LIFE',
                    name: 'LIFESTYLE',
                    count: 2,
                    // 自定义 SVG 图标 (生活/咖啡/思考风格)
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 19h20v2H2v-2zm2-17h16v12c0 2.21-1.79 4-4 4H8c-2.21 0-4-1.79-4-4V2zm4 4v6c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V6H8z"/></svg>`
                },
                {
                    id: 'CODE',
                    name: 'CREATIVE CODE',
                    count: 2,
                    // 自定义 SVG 图标 (终端风格)
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>`
                }
            ];

            // ==========================================
            // 2. 文章数据配置 (带主题字段 topic)
            // ==========================================
            const articles = [
                {
                    title: "WELCOME TO LAPUTA",
                    date: "03 AUG 2026",
                    topic: "TECH",
                    topicName: "TECHNOLOGY",
                    file: "posts/helloworld.md",
                    excerpt: "First post on the new minimal editorial platform."
                },
                {
                    title: "SWISS TYPOGRAPHY & THE MODERN WEB",
                    date: "01 AUG 2026",
                    topic: "DESIGN",
                    topicName: "DESIGN",
                    file: "posts/helloworld.md", // 可替换为实际 md 路径
                    excerpt: "Exploring grid systems, negative space, and strict typographic hierarchy."
                },
                {
                    title: "THE ART OF NEGATIVE SPACE",
                    date: "28 JUL 2026",
                    topic: "DESIGN",
                    topicName: "DESIGN",
                    file: "posts/helloworld.md",
                    excerpt: "How empty space directs reader focus and elevates aesthetic value."
                },
                {
                    title: "MINIMALIST LIFESTYLE IN 2026",
                    date: "15 JUL 2026",
                    topic: "LIFE",
                    topicName: "LIFESTYLE",
                    file: "posts/helloworld.md",
                    excerpt: "Reducing cognitive noise in digital and physical environments."
                },
                {
                    title: "CREATIVE CODING WITH CANVAS & SVG",
                    date: "10 JUL 2026",
                    topic: "CODE",
                    topicName: "CREATIVE CODE",
                    file: "posts/helloworld.md",
                    excerpt: "Building interactive geometric art using light JS scripts."
                }
            ];

            const topicsGrid = document.getElementById('topics-grid');
            const articlesList = document.getElementById('articles-list');
            const currentTopicLabel = document.getElementById('current-topic-label');
            const resetBtn = document.getElementById('reset-filter-btn');

            let activeTopicId = null;

            // ==========================================
            // 3. 渲染主题圆形气泡
            // ==========================================
            function renderTopicBubbles() {
                topicsGrid.innerHTML = '';
                topics.forEach(topic => {
                    const bubble = document.createElement('div');
                    bubble.className = `topic-bubble ${activeTopicId === topic.id ? 'active' : ''}`;
                    bubble.dataset.id = topic.id;
                    
                    bubble.innerHTML = `
                        <div class="topic-icon">${topic.svg}</div>
                        <span class="topic-name">${topic.name}</span>
                        <span class="topic-count">${topic.count} POSTS</span>
                    `;

                    bubble.addEventListener('click', () => {
                        if (activeTopicId === topic.id) {
                            activeTopicId = null; // 取消筛选
                        } else {
                            activeTopicId = topic.id;
                        }
                        updateUI();
                    });

                    topicsGrid.appendChild(bubble);
                });
            }

            // ==========================================
            // 4. 渲染文章列表 (侧边带主题)
            // ==========================================
            function renderArticles() {
                articlesList.innerHTML = '';
                const filtered = activeTopicId 
                    ? articles.filter(a => a.topic === activeTopicId)
                    : articles;

                if (filtered.length === 0) {
                    articlesList.innerHTML = `<p class="no-articles">NO ARTICLES FOUND IN THIS TOPIC.</p>`;
                    return;
                }

                filtered.forEach(article => {
                    const item = document.createElement('article');
                    item.className = 'archive-article-card';
                    item.innerHTML = `
                        <div class="article-meta-side">
                            <span class="topic-tag">${article.topicName}</span>
                            <span class="article-date">${article.date}</span>
                        </div>
                        <div class="article-info">
                            <h2 class="article-title">
                                <a href="post.html?file=${article.file}">${article.title}</a>
                            </h2>
                            <p class="article-excerpt">${article.excerpt}</p>
                        </div>
                    `;
                    articlesList.appendChild(item);
                });
            }

            // 更新 UI 状态
            function updateUI() {
                renderTopicBubbles();
                renderArticles();
                if (activeTopicId) {
                    const topicObj = topics.find(t => t.id === activeTopicId);
                    currentTopicLabel.textContent = topicObj ? topicObj.name : 'ALL TOPICS';
                    resetBtn.style.display = 'inline-block';
                } else {
                    currentTopicLabel.textContent = 'ALL TOPICS';
                    resetBtn.style.display = 'none';
                }
            }

            resetBtn.addEventListener('click', () => {
                activeTopicId = null;
                updateUI();
            });

            // 初始化渲染
            updateUI();
        });
    </script>
</body>
</html>
