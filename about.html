    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 播放列表配置
            const playlist = [
                { title: "City Lights", artist: "Lofi Chill", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
                { title: "Midnight Walk", artist: "Ambient", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
                { title: "Swiss Rhythm", artist: "Minimal Tech", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
            ];

            let currentSongIndex = 0;
            let isPlaying = false;
            let hideProgressTimer = null;

            const audio = document.getElementById('audio-player');
            const musicBubble = document.getElementById('music-bubble');
            const musicIcon = document.getElementById('music-icon');
            const progressBar = document.getElementById('music-progress-bar');
            const progressContainer = document.getElementById('music-progress-container');
            const menuBtn = document.getElementById('music-menu-btn');
            const playlistMenu = document.getElementById('music-playlist-menu');
            const playlistItems = document.getElementById('playlist-items');
            const volumeSlider = document.getElementById('volume-slider');

            // 2. 加载歌曲
            function loadSong(index) {
                currentSongIndex = index;
                audio.src = playlist[index].src;
                updatePlaylistUI();
            }

            // 3. 渲染歌单 UI
            function updatePlaylistUI() {
                playlistItems.innerHTML = '';
                playlist.forEach((song, i) => {
                    const li = document.createElement('li');
                    li.className = `playlist-item ${i === currentSongIndex ? 'active' : ''}`;
                    li.innerHTML = `
                        <span class="song-title">${song.title}</span>
                        <span class="song-artist">${song.artist}</span>
                    `;
                    li.addEventListener('click', (e) => {
                        e.stopPropagation();
                        loadSong(i);
                        playAudio();
                    });
                    playlistItems.appendChild(li);
                });
            }

            // 4. 播放控制
            function playAudio() {
                audio.play().then(() => {
                    isPlaying = true;
                    musicIcon.innerHTML = `
                        <svg class="node-icon playing" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>`;
                }).catch(err => console.log('Playback error:', err));
            }

            function pauseAudio() {
                audio.pause();
                isPlaying = false;
                musicIcon.innerHTML = `
                    <svg class="node-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>`;
            }

            // 5. 点击气泡本体切换播放/暂停（阻止进度条及下拉列表点击冒泡）
            musicBubble.addEventListener('click', (e) => {
                if (e.target.closest('#music-progress-container') || e.target.closest('#music-playlist-menu')) {
                    return;
                }
                if (isPlaying) {
                    pauseAudio();
                } else {
                    playAudio();
                }
            });

            // 6. 切换选曲弹窗展示
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playlistMenu.classList.toggle('open');
            });

            // 点击外部自动关闭选曲弹窗
            document.addEventListener('click', (e) => {
                if (!musicBubble.contains(e.target)) {
                    playlistMenu.classList.remove('open');
                }
            });

            // 7. 音量调节
            volumeSlider.addEventListener('input', (e) => {
                e.stopPropagation();
                audio.volume = volumeSlider.value;
            });

            // 8. 进度条时间同步
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = percent;
                }
            });

            // 9. 拖动进度条跳转
            progressBar.addEventListener('input', (e) => {
                e.stopPropagation();
                if (audio.duration) {
                    audio.currentTime = (progressBar.value / 100) * audio.duration;
                }
                resetInactivityTimer();
            });

            // 10. 2秒无操作自动隐藏进度条
            function resetInactivityTimer() {
                progressContainer.classList.add('visible');
                clearTimeout(hideProgressTimer);
                hideProgressTimer = setTimeout(() => {
                    if (!playlistMenu.classList.contains('open')) {
                        progressContainer.classList.remove('visible');
                    }
                }, 2000);
            }

            musicBubble.addEventListener('mousemove', resetInactivityTimer);
            musicBubble.addEventListener('click', resetInactivityTimer);
            musicBubble.addEventListener('touchstart', resetInactivityTimer);

            audio.volume = volumeSlider.value;
            loadSong(0);
        });
    </script>
