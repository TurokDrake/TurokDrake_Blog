    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playlist = [
                { title: "示例曲目 1", src: "audio/01 To the Moon - Main Theme.mp3" },
                { title: "示例曲目 2", src: "audio/song2.mp3" },
                { title: "轻音乐 - 灵感", src: "audio/song3.mp3" }
            ];

            let currentSongIndex = 0;
            let hideProgressTimer = null;

            const audio = document.getElementById('audioPlayer');
            const playToggleBtn = document.getElementById('playToggleBtn');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const statusText = document.getElementById('musicStatusText');
            
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const playlistMenu = document.getElementById('playlistMenu');
            const playlistItems = document.getElementById('playlistItems');
            const volumeSlider = document.getElementById('volumeSlider');
            
            const musicBubble = document.getElementById('musicBubble');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            // 默认音量 80%
            audio.volume = 0.8;

            // 1. 渲染歌单
            function renderPlaylist() {
                playlistItems.innerHTML = '';
                playlist.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.textContent = song.title;
                    if (index === currentSongIndex) li.classList.add('active');
                    
                    li.addEventListener('click', (e) => {
                        e.stopPropagation();
                        switchSong(index);
                        playlistMenu.classList.remove('open');
                    });
                    playlistItems.appendChild(li);
                });
            }

            // 2. 加载歌曲
            function loadSong(index) {
                currentSongIndex = index;
                audio.src = playlist[index].src;
                statusText.textContent = playlist[index].title;
                renderPlaylist();
            }

            // 3. 切歌
            function switchSong(index) {
                loadSong(index);
                audio.play();
                updatePlayStateUI(true);
            }

            // 4. 更新播放按钮UI
            function updatePlayStateUI(isPlaying) {
                if (isPlaying) {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    musicBubble.classList.add('playing');
                } else {
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    musicBubble.classList.remove('playing');
                }
            }

            // 5. 点击中央控制区播放/暂停
            playToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (audio.paused) {
                    audio.play();
                    updatePlayStateUI(true);
                } else {
                    audio.pause();
                    updatePlayStateUI(false);
                }
            });

            // 6. 点击“三个点”按钮：展开/收起选歌与音量菜单
            menuToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playlistMenu.classList.toggle('open');
            });

            // 防止点击菜单内部导致菜单关闭
            playlistMenu.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            // 点击外部关闭菜单
            document.addEventListener('click', () => {
                playlistMenu.classList.remove('open');
            });

            // 7. 音量滑动控制
            volumeSlider.addEventListener('input', (e) => {
                e.stopPropagation();
                audio.volume = volumeSlider.value;
            });

            // 8. 进度条更新
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = progressPercent;
                }
            });

            // 9. 拖动进度条跳转
            progressBar.addEventListener('input', (e) => {
                e.stopPropagation();
                if (audio.duration) {
                    audio.currentTime = (progressBar.value / 100) * audio.duration;
                }
                resetInactivityTimer();
            });

            // 10. 2秒无操作自动隐藏进度条
            function resetInactivityTimer() {
                progressContainer.classList.add('visible');
                clearTimeout(hideProgressTimer);
                hideProgressTimer = setTimeout(() => {
                    // 若选歌菜单正在展示则不自动隐藏
                    if (!playlistMenu.classList.contains('open')) {
                        progressContainer.classList.remove('visible');
                    }
                }, 2000);
            }

            musicBubble.addEventListener('mousemove', resetInactivityTimer);
            musicBubble.addEventListener('click', resetInactivityTimer);
            musicBubble.addEventListener('touchstart', resetInactivityTimer);

            loadSong(0);
        });
    </script>
</body>
